[project]
name = "change-agents"
version = "0.1.0"
description = "LangGraph agents for Site Change Agents: intake, coder, reviewer and project indexer"
requires-python = ">=3.13"
dependencies = [
    "bullmq>=3.4.3",
    "fastapi[standard]>=0.161.1",
    "langchain>=1.4.7",
    "langchain-anthropic>=1.7.6",
    "langchain-core>=1.7.0",
    "langchain-google-genai>=4.4.2",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
index-site = "change_agents.indexer.cli:main"
rag-index = "change_agents.rag.cli:index_main"
rag-search = "change_agents.rag.cli:search_main"
rag-eval = "change_agents.rag.evaluate:main"
intake-chat = "change_agents.intake.cli:main"
agents-worker = "change_agents.worker.main:main"
coder-run = "change_agents.coder.cli:main"
review-run = "change_agents.reviewer.cli:main"
review-eval = "change_agents.reviewer.evaluate:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "change_agents"
