name: site-change-agents

x-app-env: &app-env
  env_file:
    - path: .env
      required: false

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-change_agents}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_agents}
      POSTGRES_DB: ${POSTGRES_DB:-change_agents}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    # BullMQ requires Redis to never evict keys.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    <<: *app-env
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-change_agents}:${POSTGRES_PASSWORD:-change_agents}@postgres:5432/${POSTGRES_DB:-change_agents}
      REDIS_URL: redis://redis:6379
      AGENTS_URL: http://agents:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  agents:
    build: ./agents
    <<: *app-env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-change_agents}:${POSTGRES_PASSWORD:-change_agents}@postgres:5432/${POSTGRES_DB:-change_agents}
      REDIS_URL: redis://redis:6379
      SITES_REPOS_DIR: /repos
      KNOWLEDGE_DIR: /knowledge
    volumes:
      # Local checkouts of the client sites, read-only. From Phase 5 the agents clone from GitHub instead.
      - ${SITES_REPOS_DIR:-./test-sites}:/repos:ro
      # Client brand guides, plans and past tickets for RAG.
      - ./knowledge:/knowledge:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  panel:
    build: ./panel

  caddy:
    image: caddy:2-alpine
    environment:
      APP_ADDRESS: ${APP_ADDRESS:-http://app.localhost}
      SITES_ADDRESS: ${SITES_ADDRESS:-http://sites.localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${SITES_DIR:-./data/sites}:/srv/sites:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - panel

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
